<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bee-Acadamy</title>
    <link rel="icon" type="image/x-icon" href="logo.jpeg">
    <link rel="stylesheet" href="hero.css">
</head>
<body>
    <div class="container">
        <h1>Celsius To Fahrenheit Convertor</h1>
        <input id="Cel" type="number" placeholder="Enter In Celsius">
        <button onclick="Fahren()">Convert</button>
        <h1 id="res" style="color: white;"></h1>
    </div>
    <script>
        function Fahren(){
        let cel = document.getElementById("Cel").value
        let far = (cel*1.8)+32;
        let res = document.getElementById("res");
        res.innerText= far + "Fahrenheit"
        }

    </script>
</body>
</html>
