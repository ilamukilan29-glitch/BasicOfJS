<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WordCounter</title>
    <link rel="stylesheet" href="wordcounter.css">
</head>
<body>
    <div id="container">
        <h1>Word Counter</h1>
        <textarea id="Para" placeholder="Enter The Paragraph"></textarea>
        <button onclick="count()">Count Words</button>
        <h1 id="res"></h1>
    </div>
    <script>
        function count(){
        let ip = document.getElementById("Para").value.trim();
        let No = document.getElementById("res");
        if(ip===""){
            No.innerText= 0+" words" 
        }
        else{
            let resu=ip.split(/\s+/).length
            No.innerText=  resu+" Words"
        }
    }
    </script>
</body>
</html>
