<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="Calculator.css">
</head>
<body>
    <div id="container">
        <h1>Calculator</h1>
        <input id="ip" type="text" placeholder="Enter The Expression">
        <button onclick="Op()">Calculate</button>
    </div> 
    
    <script>
        let Result=document.createElement("h1")
        Result.id = 'res'
        document.getElementById("container").appendChild(Result)
        function Op(){
        let ip = document.getElementById("ip").value
        let result=0
        if(ip.indexOf('+')!==-1){
            let add = ip.split("+")
            result=Number(add[0])+Number(add[1]);
        }
        else if(ip.indexOf('-')!==-1){
            let sub = ip.split("-")
            result=Number(sub[0])-Number(sub[1]);
        }
        else if(ip.indexOf('*')!==-1){
            let mul = ip.split("*")
            result=Number(mul[0])*Number(mul[1]);
        }
        else if(ip.indexOf('/')!==-1){
            let div =ip.split("/")
            result=Number(div[0])/Number(div[1]);
        }
        document.getElementById("res").innerText= result
    }
    </script>
</body>
</html>
