<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Palindrome Checker</title>
    <link rel="stylesheet" href="Palindrome.css">
</head>
<body>
    <div id="container">
        <h1>Palindrome Checker</h1>
        <input id="ip" type="text" placeholder="Enter Sentence">
        <button onclick="check()">Check</button>
        <h1 id="res"></h1>
    </div>
    <script>
        function check(){
        let para = (document.getElementById("ip").value).toLowerCase();
        let revpara = para.split("").reverse().join("");
        let result = document.getElementById("res")
        if(para === revpara){
            result.innerText= "Palindrome"
        }
        else{
            result.innerHTML="Not a Palindrome"
        }
    }
    </script>
</body>
</html>
